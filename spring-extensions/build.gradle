apply from: "$rootDir/gradle/publishing.gradle"

description = 'Spring extensions for Stream Source'

dependencies {
	api project(':stream-source')
	api "org.springframework:spring-web:$springVersion"

	testImplementation "org.springframework:spring-context:$springVersion"
	testImplementation "org.springframework:spring-webmvc:$springVersion"
	testImplementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
	testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}
